services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strim
      POSTGRES_PASSWORD: strim
      POSTGRES_DB: strim
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strim"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: strim
      MINIO_ROOT_PASSWORD: strimstrim
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: strim
      CLICKHOUSE_USER: strim
      CLICKHOUSE_PASSWORD: strim
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres-data:
  minio-data:
  clickhouse-data:
