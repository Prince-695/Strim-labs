services:
  # Strim API & Native Bun Load Runner Engine
  - type: web
    name: strim-server
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false

  # Strim Load Console (Next.js Dashboard)
  - type: web
    name: strim-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: bun install && cd apps/web && bun run build
    startCommand: cd apps/web && bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: strim-server
          property: host
