        items:
          $ref: '#/definitions/domain.TargetItemRequest'
        maxItems: 20
        minItems: 1
        type: array
      think_time_ms:
        example: 0
        minimum: 0
        type: integer
      timeout_ms:
        example: 5000
        maximum: 60000
        minimum: 100
        type: integer
      total_requests:
        type: integer
