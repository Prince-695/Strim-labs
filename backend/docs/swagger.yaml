    required:
    - routes
    - service
    - source
    - version
    type: object
  domain.DiscoveryManifestRoute:
    properties:
      method:
        example: GET
        type: string
      path:
        example: /orders/{id}
        type: string
      tags:
        example:
        - '["orders"]'
        items:
          type: string
        type: array
    required:
    - method
    - path
    type: object
  domain.DiscoveryRunResponse:
    properties:
      created:
        example: 10
        type: integer
      error:
        example: ""
        type: string
      finished_at:
        example: "2026-11-06T10:00:02Z"
        type: string
      found:
        example: 15
        type: integer
      id:
        example: 018f3a5b-7c91-7b00-8000-000000000030
        type: string
      metadata:
        $ref: '#/definitions/domain.JSONMap'
      project_id:
        example: 018f3a5b-7c91-7b00-8000-000000000010
        type: string
      source:
        allOf:
        - $ref: '#/definitions/domain.DiscoverySource'
        example: openapi
      started_at:
        example: "2026-11-06T10:00:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.RunStatus'
        example: completed
      updated:
        example: 5
        type: integer
    type: object
  domain.DiscoverySource:
