  domain.CreateLoadTestRequest:
    properties:
      capacity_thresholds:
        $ref: '#/definitions/domain.CapacityThresholds'
      duration_seconds:
        example: 300
        maximum: 1800
        type: integer
      max_virtual_users:
        example: 200
        maximum: 500
        minimum: 0
        type: integer
      model:
        allOf:
        - $ref: '#/definitions/domain.LoadTestModel'
        enum:
        - open
        - closed
