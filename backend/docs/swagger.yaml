info:
  contact:
    email: support@strimlabs.dev
    name: API Support
  description: 'STRIM Labs backend: API observability, load testing and capacity analysis.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: STRIM Labs API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks if the server is healthy and accepting requests.
      produces:
      - application/json
      responses:
        "200":
          description: System health status
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "503":
          description: Service dependencies degraded
          schema:
            $ref: '#/definitions/domain.Response'
      summary: System Health
      tags:
      - System
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows authenticated users to change their password, revoking other
        sessions.
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Current password invalid
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Change current account password
      tags:
      - Auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit verification code to the registered email if the
        account exists.
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Code dispatched if account exists
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Request password reset OTP
      tags:
      - Auth
  /v1/auth/google/callback:
    get:
      description: Handles Google OAuth redirect, verifies state, links or creates
        user account.
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to frontend
      summary: Google OAuth callback
      tags:
      - Auth
  /v1/auth/google/login:
    get:
      description: Returns the Google OAuth2 authorization URL with PKCE.
      produces:
      - application/json
      responses:
        "200":
          description: Authorization URL
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.OAuthLoginResponse'
              type: object
      summary: Get Google OAuth URL
      tags:
      - Auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies email and password, establishing a new session and issuing
        JWT and refresh tokens.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AuthResponseData'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Account locked or rate limited
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Authenticate user credentials
      tags:
      - Auth
  /v1/auth/logout:
    post:
