info:
  contact:
    email: support@strimlabs.dev
    name: API Support
  description: 'STRIM Labs backend: API observability, load testing and capacity analysis.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: STRIM Labs API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks if the server is healthy and accepting requests.
      produces:
      - application/json
      responses:
        "200":
          description: System health status
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "503":
          description: Service dependencies degraded
          schema:
            $ref: '#/definitions/domain.Response'
      summary: System Health
      tags:
      - System
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows authenticated users to change their password, revoking other
        sessions.
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Current password invalid
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Change current account password
      tags:
      - Auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit verification code to the registered email if the
        account exists.
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Code dispatched if account exists
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Request password reset OTP
      tags:
      - Auth
  /v1/auth/google/callback:
    get:
      description: Handles Google OAuth redirect, verifies state, links or creates
        user account.
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to frontend
      summary: Google OAuth callback
      tags:
      - Auth
  /v1/auth/google/login:
    get:
      description: Returns the Google OAuth2 authorization URL with PKCE.
      produces:
      - application/json
      responses:
        "200":
          description: Authorization URL
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.OAuthLoginResponse'
              type: object
      summary: Get Google OAuth URL
      tags:
      - Auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies email and password, establishing a new session and issuing
        JWT and refresh tokens.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AuthResponseData'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/domain.Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Account locked or rate limited
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Authenticate user credentials
      tags:
      - Auth
  /v1/auth/logout:
    post:
      description: Revokes active refresh token, denylists access token, and clears
        authentication cookies.
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: End user session
      tags:
      - Auth
  /v1/auth/me:
    get:
      description: Retrieves profile and session details for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AuthMeResponseData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Auth
  /v1/auth/otp/send:
    post:
      description: Sends a 6-digit confirmation code to the authenticated user's email.
      produces:
      - application/json
      responses:
        "200":
          description: Verification code sent
          schema:
            $ref: '#/definitions/domain.Response'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Send email verification code
      tags:
      - Auth
  /v1/auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verifies the user's email address using the received code.
      parameters:
      - description: OTP verification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.UserResponse'
              type: object
        "400":
          description: Invalid or expired code
          schema:
            $ref: '#/definitions/domain.Response'
        "409":
          description: Already verified
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Verify email with 6-digit code
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the active refresh token, issues a fresh access token,
        and detects reuse attacks.
      parameters:
      - description: Optional body refresh token
        in: body
        name: request
        schema:
          $ref: '#/definitions/domain.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens rotated
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AuthResponseData'
              type: object
        "401":
          description: Token expired or reuse detected
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Rotate refresh token
      tags:
      - Auth
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Validates OTP and sets a new password, invalidating all existing
        sessions.
      parameters:
      - description: Reset password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successful
          schema:
            $ref: '#/definitions/domain.Response'
        "400":
          description: Invalid or expired OTP
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Attempt limit exceeded
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Reset account password using OTP
      tags:
      - Auth
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user, sends email verification OTP, and issues session
        tokens.
      parameters:
      - description: Signup payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AuthResponseData'
              type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/domain.Response'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Register a new user account
      tags:
      - Auth
  /v1/ingest/discovery:
    post:
      consumes:
      - application/json
      description: Ingests routes discovered during CI pipeline runs
      parameters:
      - description: Project ID
        in: header
        name: X-Project-ID
        type: string
      - description: Project ID
        in: query
        name: project_id
        type: string
      - description: CI Route Manifest
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.DiscoveryManifest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.DiscoveryRunResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Ingest discovery from CI scanner
      tags:
      - Discovery
  /v1/ingest/events:
    post:
      consumes:
      - application/json
      description: Ingests batches of up to 1,000 HTTP request telemetry events (gzip
        supported, <= 1MB compressed, <= 5MB uncompressed)
      parameters:
      - description: Project API Key
        in: header
        name: X-API-Key
        type: string
      - description: Project ID
        in: header
        name: X-Project-ID
        type: string
      - description: Bearer Project API Key
        in: header
        name: Authorization
        type: string
      - description: Project ID
        in: query
        name: project_id
        type: string
      - description: Encoding (e.g. gzip)
        in: header
        name: Content-Encoding
        type: string
      - description: Batched telemetry events payload
        in: body
        name: request
        required: true
        schema:
