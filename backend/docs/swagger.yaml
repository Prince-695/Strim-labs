basePath: /
definitions:
  domain.AddIncidentCommentRequest:
    properties:
      body:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - body
    type: object
  domain.AddMemberRequest:
    properties:
      email:
        example: engineer@acme.com
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.OrgRole'
        enum:
        - admin
        - member
        - viewer
        example: member
    required:
    - email
    - role
    type: object
  domain.AlertCondition:
    properties:
      for:
        description: '"0m", "1m", "2m", "5m"'
        type: string
      metric:
        description: '"error_rate", "latency_p95", "latency_p99", "rps"'
        type: string
      operator:
        description: '">", ">=", "<", "<="'
        type: string
      threshold:
        type: number
      window:
        description: '"1m", "5m", "15m", "1h"'
        type: string
    type: object
  domain.AlertRuleResponse:
    properties:
      channel_ids:
        items:
          type: string
        type: array
      condition:
        $ref: '#/definitions/domain.AlertCondition'
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_evaluated_at:
        type: string
      last_triggered_at:
        type: string
      muted_until:
        type: string
      name:
        type: string
      org_id:
        type: string
      pending_since:
        type: string
      project_id:
        type: string
      scope:
        $ref: '#/definitions/domain.AlertScope'
      severity:
        $ref: '#/definitions/domain.AlertSeverity'
      state:
        $ref: '#/definitions/domain.AlertState'
      updated_at:
        type: string
      version:
        type: integer
    type: object
  domain.AlertScope:
    properties:
      endpoint_id:
        type: string
      type:
        $ref: '#/definitions/domain.AlertScopeType'
    type: object
  domain.AlertScopeType:
    enum:
    - project
    - endpoint
    type: string
    x-enum-varnames:
    - AlertScopeProject
    - AlertScopeEndpoint
  domain.AlertSeverity:
    enum:
    - critical
    - warning
    - info
    type: string
    x-enum-varnames:
    - AlertSeverityCritical
    - AlertSeverityWarning
    - AlertSeverityInfo
  domain.AlertState:
    enum:
    - ok
    - pending
    - firing
    - muted
    - resolved
    type: string
    x-enum-varnames:
    - AlertStateOK
    - AlertStatePending
    - AlertStateFiring
    - AlertStateMuted
    - AlertStateResolved
  domain.AuthMeResponseData:
    properties:
      expires_at:
        type: string
      is_verified:
        type: boolean
      session_id:
        type: string
      user:
        $ref: '#/definitions/domain.UserResponse'
    type: object
  domain.AuthResponseData:
    properties:
      refresh_token:
        example: d7a8b9c0...
        type: string
      user:
        $ref: '#/definitions/domain.UserResponse'
    type: object
  domain.BottleneckHint:
    properties:
      confidence:
        type: string
      evidence:
        additionalProperties: true
        type: object
      kind:
        description: Always "hint"
        type: string
      message:
        type: string
      type:
        type: string
    type: object
  domain.BottlenecksResponse:
    properties:
      hints:
        items:
          $ref: '#/definitions/domain.BottleneckHint'
        type: array
      range:
        type: string
    type: object
  domain.CapacityReportResponse:
    properties:
      baseline_p95_ms:
        type: number
      breaking_point_rps:
        type: number
      breaking_reason:
        type: string
      confidence:
        type: string
      created_at:
        type: string
      id:
        type: string
      load_test_id:
        type: string
      note:
        type: string
      project_id:
        type: string
      sustainable_rps:
        type: number
      thresholds:
        $ref: '#/definitions/domain.CapacityThresholds'
      updated_at:
        type: string
      windows:
        items:
          $ref: '#/definitions/domain.CapacityWindow'
        type: array
    type: object
  domain.CapacityThresholds:
    properties:
      max_error_rate:
        type: number
      min_achieved_ratio:
        type: number
      p95_multiplier:
        type: number
    type: object
  domain.CapacityWindow:
    properties:
      achieved_rps:
        type: number
      end_second:
        type: integer
      error_rate:
        type: number
      failure_reason:
        type: string
      healthy:
        type: boolean
      index:
        type: integer
      offered_rps:
        type: number
      p95_ms:
        type: number
      start_second:
        type: integer
    type: object
  domain.ChangePasswordRequest:
    properties:
      new_password:
        example: N3wS3cure!pass
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        example: S3cure!pass
        type: string
    required:
    - new_password
    - old_password
    type: object
  domain.ChannelResponse:
    properties:
      config:
        $ref: '#/definitions/domain.JSONMap'
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      org_id:
        type: string
      project_id:
        type: string
      type:
        $ref: '#/definitions/domain.ChannelType'
      updated_at:
        type: string
    type: object
  domain.ChannelType:
    enum:
    - slack
    - email
    - webhook
    type: string
    x-enum-varnames:
    - ChannelTypeSlack
    - ChannelTypeEmail
    - ChannelTypeWebhook
  domain.CheckUsernameResponse:
    properties:
      available:
        example: true
        type: boolean
      username:
        example: asha
        type: string
    type: object
  domain.CheckVerificationResponse:
    properties:
      reason:
        example: TXT record not found
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.VerificationStatus'
        example: verified
      verified_at:
        type: string
    type: object
  domain.CompareLoadTestsRequest:
    properties:
      baseline_id:
        type: string
      test_ids:
        items:
          type: string
        type: array
    type: object
  domain.CompareLoadTestsResponse:
    properties:
      baseline_id:
        type: string
      deltas:
        items:
          $ref: '#/definitions/domain.CompareTestDelta'
        type: array
      overlay:
        $ref: '#/definitions/domain.CompareOverlay'
      tests:
        items:
          $ref: '#/definitions/domain.CompareTestSummary'
        type: array
    type: object
  domain.CompareOverlay:
    properties:
      series:
        items:
          $ref: '#/definitions/domain.OverlaySeries'
        type: array
      step:
        type: string
    type: object
  domain.CompareTestDelta:
    properties:
      avg_rps_pct:
        type: number
      error_rate_pct:
        type: number
      p95_pct:
        type: number
      peak_rps_pct:
        type: number
      test_id:
        type: string
      verdict:
        description: improved, regressed, unchanged
        type: string
    type: object
  domain.CompareTestSummary:
    properties:
      avg_rps:
        type: number
      error_rate:
        type: number
      id:
        type: string
      name:
        type: string
      p95_ms:
        type: number
      peak_rps:
        type: number
      sustainable_rps:
        type: number
    type: object
  domain.CreateAlertRuleRequest:
    properties:
      channel_ids:
        items:
          type: string
        type: array
      condition:
        $ref: '#/definitions/domain.AlertCondition'
      description:
        maxLength: 512
        type: string
      enabled:
        type: boolean
      name:
        maxLength: 128
        minLength: 2
        type: string
      scope:
        $ref: '#/definitions/domain.AlertScope'
      severity:
        allOf:
        - $ref: '#/definitions/domain.AlertSeverity'
        enum:
        - critical
        - warning
        - info
    required:
    - condition
    - name
    - scope
    - severity
    type: object
  domain.CreateChannelRequest:
    properties:
      config:
        $ref: '#/definitions/domain.JSONMap'
      name:
        maxLength: 128
        minLength: 2
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.ChannelType'
        enum:
        - slack
        - email
        - webhook
    required:
    - config
    - name
    - type
    type: object
  domain.CreateLoadTestRequest:
    properties:
      capacity_thresholds:
        $ref: '#/definitions/domain.CapacityThresholds'
      duration_seconds:
        example: 300
        maximum: 1800
        type: integer
      max_virtual_users:
        example: 200
        maximum: 500
        minimum: 0
        type: integer
      model:
        allOf:
        - $ref: '#/definitions/domain.LoadTestModel'
        enum:
        - open
        - closed
        example: open
      name:
        example: Checkout Ramp Test
        maxLength: 100
        minLength: 2
        type: string
      peak_rate:
        example: 500
        minimum: 0
        type: number
      profile:
        allOf:
        - $ref: '#/definitions/domain.LoadTestProfile'
        enum:
        - sustained
        - ramp
        - spike
        - step
        example: ramp
      ramp_up_seconds:
        example: 120
        minimum: 0
        type: integer
      spike:
        $ref: '#/definitions/domain.SpikeConfig'
      start_now:
        example: true
        type: boolean
      start_rate:
        example: 10
        minimum: 0
        type: number
      step:
        $ref: '#/definitions/domain.StepConfig'
      targets:
        items:
          $ref: '#/definitions/domain.TargetItemRequest'
        maxItems: 20
        minItems: 1
        type: array
      think_time_ms:
        example: 0
        minimum: 0
        type: integer
      timeout_ms:
        example: 5000
        maximum: 60000
        minimum: 100
        type: integer
      total_requests:
        type: integer
    required:
    - duration_seconds
    - model
    - name
    - profile
    - targets
    type: object
  domain.CreateOrgRequest:
    properties:
      description:
        example: Cloud telemetry platform
        maxLength: 500
        type: string
      name:
        example: Strim Labs
        maxLength: 100
        minLength: 2
        type: string
      slug:
        example: strim-labs
        maxLength: 50
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  domain.CreateProjectRequest:
    properties:
      base_url:
        example: https://api.acme.com
        type: string
      description:
        example: Orders and payments
        maxLength: 500
        type: string
      environment:
        allOf:
        - $ref: '#/definitions/domain.ProjectEnvironment'
        enum:
        - development
        - staging
        - production
        example: production
      name:
        example: Checkout API
        maxLength: 100
        minLength: 2
        type: string
      slug:
        example: checkout-api
        maxLength: 50
        minLength: 2
        type: string
    required:
    - base_url
    - name
    - slug
    type: object
  domain.DNSInstructions:
    properties:
      host:
        example: _strim.api.acme.com
        type: string
      type:
