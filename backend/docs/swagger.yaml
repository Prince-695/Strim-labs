basePath: /
definitions:
  domain.PageMeta:
    properties:
      has_more:
        example: false
        type: boolean
      limit:
        example: 50
        type: integer
      next_cursor:
        example: 0192f1b2-7c1e-7a3b-9d0a-3f5b6c7d8e9f
        type: string
      total:
        example: 120
        type: integer
    type: object
  domain.Response:
    properties:
      access_token:
        type: string
      data: {}
      details: {}
      error:
        type: string
      error_code:
        type: string
      message:
        type: string
      meta:
        $ref: '#/definitions/domain.PageMeta'
      request_id:
        type: string
      response_time:
        type: string
      success:
        type: boolean
    type: object
info:
  contact:
    email: support@strimlabs.dev
    name: API Support
  description: 'STRIM Labs backend: API observability, load testing and capacity analysis.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: STRIM Labs API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks if the server is healthy and accepting requests.
      produces:
      - application/json
      responses:
        "200":
          description: System health status
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "503":
          description: Service dependencies degraded
          schema:
            $ref: '#/definitions/domain.Response'
      summary: System Health
      tags:
      - System
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and then your token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
