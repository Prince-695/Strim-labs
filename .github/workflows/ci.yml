name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strim
          POSTGRES_PASSWORD: strim
          POSTGRES_DB: strim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://strim:strim@localhost:5432/strim_test
      JWT_SECRET: ci-jwt-secret-change-me-32chars
      API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - run: bun install
      - run: bun run db:generate
      - run: bun run --filter @strim/db push
      - run: bun test
      - run: bun run --filter @strim/shared typecheck
      - run: bun run --filter @strim/sdk typecheck
