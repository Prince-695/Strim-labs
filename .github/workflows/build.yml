
name: Full Build & Deploy

on:
  push:
    branches:
      - main

jobs:

  # ======================
  # 🔍 DETECT CHANGES
  # ======================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'


  # ======================
  # 🔵 BACKEND BUILD
  # ======================
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.backend == 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lint
        run: golangci-lint run ./...

      - name: Build
        run: go build ./...


  # ======================
  # 🚀 BACKEND DEPLOY (Render)
  # ======================
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest

    timeout-minutes: 40

    needs: [backend, changes]

    if: |
      needs.backend.result == 'success' &&
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Trigger Render Deployment
        id: trigger
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          response=$(curl -sS \
            -X POST \
            -w '\n%{http_code}' \
            "$RENDER_DEPLOY_HOOK")

          http_code="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "Render HTTP response: $http_code"

          if [ "$http_code" = "202" ]; then
            echo "::error::Render has another deployment in progress. The hook queued this deployment but did not return its deployment ID. Please check Render and rerun after the active deployment finishes."
            exit 1
          fi

          if [ "$http_code" != "200" ]; then
            echo "::error::Render deployment trigger failed: $body"
            exit 1
          fi

          deploy_id=$(echo "$body" | jq -r '.deploy.id // empty')

          if [ -z "$deploy_id" ]; then
            echo "::error::Could not retrieve Render deployment ID."
            exit 1
          fi

          echo "Deployment ID: $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Monitor Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          echo "Monitoring Render deployment: $DEPLOY_ID"

          for attempt in $(seq 1 180); do

            response=$(curl -fsS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")

            status=$(echo "$response" | jq -r '.status // empty')

            echo "Attempt $attempt/180 | Status: $status"

            case "$status" in
              live)
                echo "Render deployment completed successfully!"
                exit 0
                ;;

              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment failed with status: $status"
                exit 1
                ;;

              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep 10
                ;;

              *)
                echo "::error::Unknown or empty Render deployment status: $status"
                exit 1
                ;;
            esac

          done

          echo "::error::Render deployment timed out after 30 minutes."
          exit 1


  # ======================
  # 🟡 FRONTEND BUILD
  # ======================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Type check
        run: pnpm typecheck
        working-directory: frontend

      - name: Format check
        run: pnpm format:check
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend


  # ======================
  # 🚀 FRONTEND DEPLOY (Vercel)
  # ======================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest

    needs: [frontend, changes]

    if: |
      needs.frontend.result == 'success' &&
      needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
