services:
  postgres:
    image: postgres:16-alpine
    container_name: strim-postgres
    environment:
      POSTGRES_USER: strim
      POSTGRES_PASSWORD: strim_secure_password
      POSTGRES_DB: strim_labs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strim -d strim_labs"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - strim_network
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.server
    container_name: strim-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: "postgresql://strim:strim_secure_password@postgres:5432/strim_labs?sslmode=disable"
      DB_RUN: "true"
      JWT_SECRET: "strim_production_super_secret_jwt_key_32_chars_long_2026"
      ACCESS_TOKEN_EXPIRY: "30m"
      REFRESH_TOKEN_EXPIRY: "168h"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,https://strim-labs.vercel.app"
      FRONTEND_URL: "http://localhost:3000"
      SWAGGER_USER: "admin"
      SWAGGER_PASS: "strim_docs_2026"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - strim_network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: strim-worker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ENV: "production"
      DATABASE_URL: "postgresql://strim:strim_secure_password@postgres:5432/strim_labs?sslmode=disable"
      JWT_SECRET: "strim_production_super_secret_jwt_key_32_chars_long_2026"
    networks:
      - strim_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  strim_network:
    driver: bridge
